<div class="hero-visual">
  <div class="pc-card-wrapper" id="profileCardWrapper">
    <div class="pc-card-shell">
      <div class="pc-card">
        <div class="pc-inside">
          <div class="pc-shine"></div>
          <div class="pc-glare"></div>
          
          <div class="pc-content pc-avatar-content">
            <img 
              src="img/avatar.jpg" 
              alt="Avatar" 
              class="avatar"
              onerror="this.src='https://via.placeholder.com/300'"
            />
            
            <div class="pc-user-info">
              <div class="pc-user-details">
                <div class="pc-mini-avatar">
                  <img src="img/avatar.jpg" alt="Mini Avatar" onerror="this.src='https://via.placeholder.com/50'"/>
                </div>
                <div class="pc-user-text">
                  <div class="pc-handle">@phamphuvi</div>
                  <div class="pc-status">Online</div>
                </div>
              </div>
              <button class="pc-contact-btn" onclick="document.getElementById('contact').scrollIntoView({behavior: 'smooth'})">
                Contact Me
              </button>
            </div>
          </div>
          
          <div class="pc-content">
            <div class="pc-details">
              <h3>Phạm Phú Vĩ</h3>
              <p>IoT & Automation Engineer</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
